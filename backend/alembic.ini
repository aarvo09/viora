# Alembic configuration for VIORA.
#
# The database URL is NOT set here — it is read from app.config.settings inside
# alembic/env.py, so there is exactly one place a connection string lives and no
# risk of migrations running against a different database than the app.

[alembic]
script_location = alembic
prepend_sys_path = .
# Timestamped, sortable revision filenames; the slug comes from -m.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
